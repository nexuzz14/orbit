name: Orbit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # 1. Pemindaian Rahasia (Gitleaks)
  # --------------------------------------------------------------------------
  gitleaks:
    name: Pemindaian Rahasia (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Jalankan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # --------------------------------------------------------------------------
  # 2. Database & RLS Testing (Supabase + pgTAP)
  # --------------------------------------------------------------------------
  database:
    name: Pengujian Database & RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mulai Supabase Stack Lokal
        run: |
          supabase init --force --with-vscode-settings=false
          supabase start -x studio,imgproxy,vector,logflare,edge-runtime,postgres-meta,realtime,supavisor

      - name: Jalankan Uji pgTAP (Matriks Peran, IDOR, Integritas)
        run: |
          supabase test db

  # --------------------------------------------------------------------------
  # 3. Web Lint, Typecheck, Audit, & Test (Next.js)
  # --------------------------------------------------------------------------
  web:
    name: Validasi Web (Lint, Typecheck, Audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Pasang Dependensi
        run: npm ci

      - name: Audit Dependensi (Keamanan)
        run: npm audit --audit-level=high

      - name: Validasi Tipe (Typecheck)
        run: npm run typecheck

      - name: Linter (ESLint)
        run: npm run lint

      - name: Uji Unit Web
        run: npm test --if-present

  # --------------------------------------------------------------------------
  # 4. Mobile / Flutter Lint & Test
  # --------------------------------------------------------------------------
  mobile:
    name: Validasi Flutter App (Analyze & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ambil Paket Flutter
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Uji Unit Flutter
        run: flutter test
