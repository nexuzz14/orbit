name: Orbit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # 1. Pemindaian Rahasia (Gitleaks)
  # --------------------------------------------------------------------------
  gitleaks:
    name: Pemindaian Rahasia (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hitung dan Tampilkan Jumlah Commit
        run: |
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          echo "Memindai seluruh riwayat git: $TOTAL_COMMITS commit."

      - name: Jalankan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # --------------------------------------------------------------------------
  # 2. Database & RLS Testing (Supabase + pgTAP)
  # --------------------------------------------------------------------------
  database:
    name: Pengujian Database & RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mulai Supabase Stack Lokal
        run: |
          supabase init --force --with-vscode-settings=false
          supabase start -x studio,imgproxy,vector,logflare,edge-runtime,postgres-meta,realtime,supavisor

      - name: Jalankan Uji pgTAP (Matriks Peran, IDOR, Integritas)
        run: |
          supabase test db

  # --------------------------------------------------------------------------
  # 3. Uji Pemulihan Cadangan Database (Restore-Test & Paritas Skema)
  # --------------------------------------------------------------------------
  restore-test:
    name: Uji Pemulihan Cadangan (Restore-Test & Paritas)
    runs-on: ubuntu-latest
    services:
      postgres_target:
        image: postgres:16
        env:
          POSTGRES_USER: orbit_user
          POSTGRES_PASSWORD: orbit_password
          POSTGRES_DB: orbit_restore
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mulai Supabase Stack Lokal
        run: |
          supabase init --force --with-vscode-settings=false
          supabase start -x studio,imgproxy,vector,logflare,edge-runtime,postgres-meta,realtime,supavisor

      - name: Ekspor Cadangan Skema Lokal (supabase db dump)
        run: |
          supabase db dump -f local_backup.sql

      - name: Pulihkan Cadangan ke PostgreSQL Target (Restore Test)
        run: |
          PGPASSWORD=orbit_password psql -h localhost -p 5433 -U orbit_user -d orbit_restore -f local_backup.sql

      - name: Verifikasi Sanity Check pada Database Hasil Pemulihan
        run: |
          PGPASSWORD=orbit_password psql -h localhost -p 5433 -U orbit_user -d orbit_restore -c "select count(*) from information_schema.tables where table_schema = 'public';"

      - name: Jalankan Perhitungan Paritas Skema pada Database CI
        id: local_schema
        run: |
          PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -f supabase/scripts/schema_signature.sql

      - name: Bandingkan Signature Skema Lokal CI dengan Cloud Supabase
        env:
          CLOUD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          LOCAL_SIG=$(PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -t -A -f supabase/scripts/schema_signature.sql)
          echo "Signature Skema Lokal CI: $LOCAL_SIG"
          if [ -n "$CLOUD_DB_URL" ]; then
            CLOUD_SIG=$(psql "$CLOUD_DB_URL" -t -A -f supabase/scripts/schema_signature.sql)
            echo "Signature Skema Cloud: $CLOUD_SIG"
            if [ "$LOCAL_SIG" != "$CLOUD_SIG" ]; then
              echo "Error: Selisih skema terdeteksi antara migrasi repo dan database cloud!"
              exit 1
            fi
            echo "Paritas skema 100% cocok (zero diff)."
          else
            echo "SUPABASE_DB_URL tidak tersedia di secret repository, perbandingan cloud dilewati."
          fi

  # --------------------------------------------------------------------------
  # 4. Web Lint, Typecheck, Audit, & Test (Next.js & Playwright CSP)
  # --------------------------------------------------------------------------
  web:
    name: Validasi Web (Lint, Typecheck, Audit, CSP E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Pasang Dependensi
        run: npm ci

      - name: Audit Dependensi (Keamanan)
        run: npm audit --audit-level=high

      - name: Validasi Tipe (Typecheck)
        run: npm run typecheck

      - name: Linter (ESLint)
        run: npm run lint

      - name: Pasang Browser Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Web Production
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

      - name: Uji E2E CSP & Hidrasi (Playwright)
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

  # --------------------------------------------------------------------------
  # 5. Mobile / Flutter Lint & Test
  # --------------------------------------------------------------------------
  mobile:
    name: Validasi Flutter App (Analyze & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ambil Paket Flutter
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Uji Unit Flutter
        run: flutter test
