name: Database Backup (Daily Encrypted)

on:
  schedule:
    # Berjalan harian pada 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup & Enkripsi Database
    runs-on: ubuntu-latest
    steps:
      - name: Pasang PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg

      - name: Jalankan pg_dump & Enkripsi GPG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "Error: Secret DATABASE_URL atau BACKUP_ENCRYPTION_KEY belum dikonfigurasi di GitHub Secrets."
            exit 1
          fi

          BACKUP_DATE=$(date +'%Y%m%d_%H%M%S')
          RAW_FILE="orbit_backup_${BACKUP_DATE}.dump"
          ENC_FILE="orbit_backup_${BACKUP_DATE}.dump.gpg"

          echo "Memulai pg_dump..."
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$RAW_FILE"

          echo "Mengenkripsi dump dengan AES256 via GPG..."
          gpg --symmetric --batch --yes \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            --cipher-algo AES256 \
            -o "$ENC_FILE" \
            "$RAW_FILE"

          # Hapus file mentah tanpa enkripsi dari runner
          rm -f "$RAW_FILE"
          echo "Dump terenkripsi berhasil dibuat: $ENC_FILE"
          echo "FILENAME=$ENC_FILE" >> $GITHUB_ENV

      - name: Simpan Artefak Terenkripsi
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 30

  restore-test:
    name: Uji Pemulihan Cadangan (Restore Test)
    needs: backup
    runs-on: ubuntu-latest
    services:
      postgres_target:
        image: postgres:16
        env:
          POSTGRES_USER: orbit_restore_user
          POSTGRES_PASSWORD: orbit_restore_password
          POSTGRES_DB: orbit_restore_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang PostgreSQL Client & GPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg

      - name: Unduh Artefak Cadangan
        uses: actions/download-artifact@v4
        with:
          path: ./backups

      - name: Dekripsi dan Uji Restore ke Container Efemeral
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          TARGET_DATABASE_URL: postgres://orbit_restore_user:orbit_restore_password@localhost:5434/orbit_restore_db
        run: |
          ENC_FILE=$(find ./backups -name "*.dump.gpg" | head -n 1)
          if [ -z "$ENC_FILE" ]; then
            echo "Error: Berkas cadangan terenkripsi tidak ditemukan."
            exit 1
          fi
          echo "Menjalankan restore test dari $ENC_FILE..."
          chmod +x ./supabase/scripts/restore.sh
          ./supabase/scripts/restore.sh "$ENC_FILE"

      - name: Verifikasi Sanity Check Data Pasca-Restore
        run: |
          PGPASSWORD=orbit_restore_password psql -h localhost -p 5434 -U orbit_restore_user -d orbit_restore_db -c "select count(*) as total_tables from information_schema.tables where table_schema = 'public';"
          echo "Verifikasi pemulihan sukses 100%."
